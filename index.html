<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>にほんご帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Noto+Serif+TC:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE  everyday study, calm and quiet like a MUJI notebook
   IDEA   a MUJI recycled-paper notebook with kraft cover: unbleached paper, thin rules, one dark-red accent
   PICTURE the open notebook card itself (flashcard / word page), large, with the topic's line icon
   COLOUR unbleached paper #f7f5f0, ink #3c3a36, kraft #b5a68a, one muted red #8c2f2b, sage for correct
   TYPE   Zen Kaku Gothic New for Japanese, Noto Sans TC light for Chinese; system Hiragino offline
   LAYOUT top bar + tabs on laptop; bottom tab bar on phone; content column ≤ 760px */
:root{color-scheme:light;--bg:#f7f5f0;--paper:#fdfcf9;--ink:#3c3a36;--soft:#8a857b;--line:#e4dfd4;--kraft:#b5a68a;--kraft2:#ece5d6;--red:#8c2f2b;--sage:#5f7a5c;--amber:#a8814e;--jp:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;--tc:"Noto Sans TC","PingFang TC","Hiragino Sans",sans-serif}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:300 16px/1.65 var(--tc);overflow-x:clip;-webkit-font-smoothing:antialiased}
b,strong,h1,h2,h3{font-weight:500}
.jp,ruby{font-family:var(--jp)}
rt{font-size:.5em;color:var(--soft);font-weight:400}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ic{flex:none}
/* 頂部 */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:0 max(4vw,16px);padding-top:env(safe-area-inset-top)}
.bar{max-width:980px;margin:auto;display:flex;align-items:center;gap:24px;min-height:58px}
.logo{font:500 18px var(--jp);letter-spacing:.04em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo i{width:10px;height:10px;background:var(--red);display:inline-block}
.logo small{font:300 12px var(--tc);color:var(--soft);letter-spacing:0}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{background:none;border:0;padding:8px 14px;min-height:44px;cursor:pointer;color:var(--soft);font-size:15px;display:flex;align-items:center;gap:7px;border-bottom:2px solid transparent}
.nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
main{max-width:980px;margin:auto;padding:22px max(4vw,16px) 110px}
.view>h2{font:500 26px/1.2 var(--jp);margin:6px 0 4px;letter-spacing:.02em}
.lead{color:var(--soft);margin:0 0 18px;font-size:14px}
/* 首頁 */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;margin-bottom:26px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:22px 24px;position:relative;background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-position:0 18px}
.note .tape{position:absolute;top:-9px;left:28px;width:74px;height:18px;background:var(--kraft2);opacity:.9;transform:rotate(-2deg)}
.today{font:500 13px var(--tc);color:var(--soft);margin:0 0 8px}
.big{font:500 clamp(40px,8vw,60px)/1 var(--jp);letter-spacing:-.01em}
.big small{font:300 15px var(--tc);color:var(--soft);margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.kpi{border-top:1px solid var(--ink);padding-top:6px}.kpi b{display:block;font:500 22px var(--jp)}.kpi span{font-size:12px;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;font-size:15px;font-weight:400}
.btn.ghost{background:transparent;color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sec-h h3{margin:0;font:500 17px var(--jp)}.sec-h span{font-size:13px;color:var(--soft)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:12px;cursor:pointer;text-align:left;min-height:56px}
.tile:hover{border-color:var(--ink)}.tile .ic{color:var(--ink)}.tile b{display:block;font-size:14px;font-weight:400;line-height:1.3}.tile span{font-size:12px;color:var(--soft)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lt{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:12px 14px;cursor:pointer;text-align:left;min-height:64px}
.lt:hover{border-color:var(--ink)}.lt em{font:500 12px var(--jp);color:var(--red);font-style:normal;display:block}.lt b{font-weight:400;font-size:14px}
/* 單字列表 */
.tools{display:flex;gap:8px;position:sticky;top:59px;z-index:5;background:var(--bg);padding:8px 0 10px}
.tools input,.tools select{font:16px var(--tc);font-weight:300;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);min-height:46px;padding:0 12px}
.tools input{flex:1}.tools select{max-width:42%}
.count{font-size:13px;color:var(--soft);margin:0 0 6px}
.tg{display:flex;align-items:center;gap:10px;margin:24px 0 6px;font:500 15px var(--jp);padding-bottom:6px;border-bottom:1px solid var(--ink);scroll-margin-top:130px}
.tg span{font:300 12px var(--tc);color:var(--soft)}
.row{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.rmain{flex:1;display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) auto;gap:12px;align-items:end;background:none;border:0;padding:6px 4px;min-height:54px;cursor:pointer;text-align:left}
.rmain:hover{background:var(--paper)}
.rmain .w{font:500 19px/1.9 var(--jp)}.rmain .z{padding-bottom:7px}.rmain .p{font-size:12px;color:var(--soft);white-space:nowrap;padding-bottom:8px}
.row.core .w::after{content:"●";color:var(--red);font-size:7px;vertical-align:super;margin-left:4px}
.say{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink)}
.say svg{width:17px;height:17px}.say.on{border-color:var(--red);color:var(--red)}
/* 單字詳細 */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(40,36,30,.35);display:flex;align-items:flex-end;justify-content:center}
.sbox{position:relative;width:min(720px,100%);max-height:92svh;overflow:auto;background:var(--paper);border-radius:6px 6px 0 0;padding:20px max(4vw,20px) calc(28px + env(safe-area-inset-bottom))}
@media(min-width:760px){.sheet{align-items:center}.sbox{border-radius:4px;max-height:88svh}}
.close{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:18px;z-index:1}
.dtop{display:flex;align-items:center;gap:8px;color:var(--soft);font-size:13px;flex-wrap:wrap;margin-right:52px}
.tag{border:1px solid var(--line);border-radius:2px;padding:0 8px;font-size:12px;color:var(--soft);background:var(--bg)}
.tag.core{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.dw{display:flex;align-items:flex-end;gap:12px;margin-top:8px}.dw .w{font:500 clamp(40px,9vw,58px)/1.55 var(--jp)}
.dzh{font-size:22px;font-weight:400;margin-bottom:6px}
.blk{margin-top:18px}.blk h4{margin:0 0 8px;font:500 13px var(--tc);color:var(--soft);display:flex;align-items:center;gap:8px}.blk h4::after{content:"";flex:1;height:1px;background:var(--line)}
.use{font-size:16px}
.colloc{display:flex;flex-wrap:wrap;gap:6px}.colloc span{background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:2px 10px;font:400 16px/2 var(--jp)}
.reg{font-size:14px;color:var(--soft);margin-top:6px}
.pit{background:color-mix(in srgb,var(--red) 8%,var(--paper));border-left:2px solid var(--red);padding:8px 12px;font-size:15px;margin-top:10px}
.exl{display:flex;flex-direction:column;gap:12px}.exi{display:flex;gap:12px;align-items:flex-start}
.exi .jpx{font:400 18px/2.05 var(--jp)}.exi .t{color:var(--soft);font-size:14px}.exi .say{margin-top:4px}
.cj{width:100%;border-collapse:collapse;font-size:15px}.cj th,.cj td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}.cj th{color:var(--soft);font-weight:300;width:38%}
.cj td b{font:500 17px var(--jp)}.cj td small{display:block;color:var(--soft);font-family:var(--jp)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip2{border:1px solid var(--line);background:var(--bg);border-radius:2px;padding:6px 12px;min-height:40px;cursor:pointer;font-size:14px}
.chip2 b{font:500 16px var(--jp);margin-right:6px}.chip2:hover{border-color:var(--ink)}
/* 閃卡 */
.fhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{background:none;border:0;padding:0 14px;min-height:40px;cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.fstats{display:flex;gap:16px;font-size:13px;color:var(--soft)}.fstats b{font:500 17px var(--jp);color:var(--ink);margin-right:3px}
.stage{position:relative;max-width:620px;margin:6px auto 0}
.stack{position:absolute;inset:8px -6px -8px 6px;background:var(--paper);border:1px solid var(--line);border-radius:4px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:4px;min-height:400px;padding:26px 26px 22px;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--line)}
.card .cic{position:absolute;right:20px;top:20px;color:var(--kraft)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-right:40px}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:14px 0}
.fw{font:500 clamp(46px,10vw,72px)/1.15 var(--jp)}.fz{font:400 clamp(28px,6vw,40px)/1.3 var(--tc)}
.hint{font-size:13px;color:var(--soft)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;margin-top:14px}
.ch{border:1px solid var(--line);background:var(--bg);border-radius:2px;min-height:56px;padding:6px 12px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center;font-size:16px}
.ch b{font:400 12px var(--jp);color:var(--soft);width:16px}.ch.j{font:500 19px var(--jp)}.ch:hover{border-color:var(--ink)}
.spell{display:flex;gap:8px;width:100%;max-width:420px;margin-top:10px}
.spell input{flex:1;font:400 20px var(--jp);border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink);padding:0 12px;min-height:50px}
.back{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.verdict{font-weight:500}.ok{color:var(--sage)}.ng{color:var(--red)}
.bw{display:flex;align-items:flex-end;gap:12px}.bw .w{font:500 clamp(38px,8vw,52px)/1.6 var(--jp)}
.bex{border-left:2px solid var(--kraft);padding-left:12px}.bex .jpx{font:400 18px/2.05 var(--jp)}.bex .t{color:var(--soft);font-size:14px}
.act{max-width:620px;margin:20px auto 0;display:flex;gap:8px}.act .btn{flex:1;min-height:56px}
.act .guess{flex:0 0 40%;background:transparent;color:var(--amber);border-color:var(--amber)}
.act .btn{flex-direction:column;gap:0;line-height:1.3}.act small{display:block;font-size:11px;opacity:.8}
.act .btn:disabled{opacity:.3;cursor:default}
.keys{text-align:center;font-size:12px;color:var(--soft);margin-top:10px}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
details.set{max-width:620px;margin:26px auto 0;border-top:1px solid var(--line)}
details.set summary{cursor:pointer;padding:14px 0;min-height:44px;font-size:15px}
.fset{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:16px}
.fset label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--soft)}
.fset select,.fset input[type=number]{font:16px var(--tc);font-weight:300;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);padding:0 10px;min-height:44px}
.fset .chk{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--ink)}.chk input{width:18px;height:18px;accent-color:var(--ink)}
.wl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:4px 12px;font-size:15px;padding-bottom:12px}.wl .w{font:500 17px var(--jp)}.wl .p{text-align:right;white-space:nowrap}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 90px 52px;gap:10px;align-items:center;font-size:14px;padding:4px 0}.tr .p{text-align:right;white-space:nowrap}
.barl{height:4px;background:var(--line)}.barl i{display:block;height:100%;background:var(--ink)}
.small{font-size:13px;color:var(--soft)}
.bk textarea{width:100%;min-height:90px;font:13px monospace;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px}
/* 文法 */
.lessons{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.lessons button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:2px;min-height:40px;padding:0 14px;cursor:pointer;font-size:14px}
.lessons button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gindex{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin-bottom:18px}
.gi{display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);background:var(--paper);border-radius:2px;padding:8px 12px;cursor:pointer;text-align:left;min-height:46px}
.gi em{font:500 12px var(--jp);color:var(--red);font-style:normal}.gi:hover{border-color:var(--ink)}
.gwrap{display:flex;flex-direction:column;gap:16px}
.lv{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-top:18px}
.lv h4{margin:0 0 10px;font:500 15px var(--jp)}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
/* 手機 */
.tabbar{display:none}
@media(max-width:700px){
 .nav{display:none}
 .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
 .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;min-height:58px;font-size:11px;color:var(--soft);cursor:pointer}
 .tabbar button[aria-selected=true]{color:var(--ink)}
 .tabbar button[aria-selected=true] .ic{color:var(--red)}
 .hero{grid-template-columns:minmax(0,1fr)}
 .choices{grid-template-columns:minmax(0,1fr)}
 .fset{grid-template-columns:minmax(0,1fr)}
 .card{padding:22px 18px 18px;min-height:360px}
 .rmain{grid-template-columns:minmax(0,7em) minmax(0,1fr) auto}
 .tools{top:58px}
}
@media(prefers-reduced-motion:no-preference){.card.anim{animation:fl .25s ease}@keyframes fl{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* VOICE  a quiet daily study journal — calm, literary, unhurried
   IDEA   ことば-style printed journal: one framed paper column, Mincho headlines, tracked small labels
   PICTURE the 今日一字 focus panel with a huge Mincho word and a faint vertical 日本語 watermark
   COLOUR paper #f6f5f0 framed on #fbfbf9, ink #2b2b27, grey #8a8983, sage #6b7a60 labels, brick #9a4b3d for wrong
   TYPE   Shippori Mincho for Japanese display, Noto Serif TC for section titles, Noto Sans TC body
   LAYOUT masthead + text tabs, one 1000px framed column; bottom tab bar on phones */
:root{--bg:#f6f5f0;--paper:#fdfdfb;--ink:#2b2b27;--soft:#8a8983;--line:#dddbd3;--red:#6b7a60;--sage:#6b7a60;--ng:#9a4b3d;--kraft:#b9b7ae;--kraft2:#e8e7e1;--panel:#e8e7e1;
 --min:"Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;--stc:"Noto Serif TC","Songti TC","Shippori Mincho",serif}
body{background:#fbfbf9;color:var(--ink)}
.frame{max-width:1000px;margin:0 auto;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:calc(26px + env(safe-area-inset-top)) clamp(20px,5vw,56px) 18px}
.mast .logo{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.mast .logo b{font:400 clamp(30px,4.4vw,40px)/1.1 var(--min);letter-spacing:.04em}
.mast .logo small{font:400 12px var(--tc);color:var(--soft);letter-spacing:.32em}
.mast .date{font:400 13px var(--tc);color:var(--soft);letter-spacing:.24em;padding-top:14px;white-space:nowrap}
.nav{position:sticky;top:0;z-index:10;display:flex;gap:clamp(8px,3vw,36px);margin:0;padding:0 clamp(20px,5vw,56px);background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.nav button{padding:12px 2px;min-height:48px;font-size:14px;letter-spacing:.24em;color:var(--soft);border-bottom:1px solid transparent;margin-bottom:-1px}
.nav button .ic{display:none}
.nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
main{max-width:none;padding:clamp(28px,4vw,48px) clamp(20px,5vw,56px) 110px}
.eb{font:500 13px var(--tc);letter-spacing:.32em;color:var(--sage);margin:0 0 14px}
.view>h2{font:400 clamp(34px,5vw,46px)/1.15 var(--min);letter-spacing:.03em;margin:0 0 10px}
.lead{font-size:15px;color:var(--soft);margin:0 0 26px;letter-spacing:.04em}
.hl{font:400 clamp(40px,7vw,66px)/1.22 var(--min);letter-spacing:.02em;margin:0 0 18px}
.sub{color:var(--soft);font-size:16px;letter-spacing:.06em;margin:0}
.focus{position:relative;overflow:hidden;background:var(--panel);padding:clamp(26px,4vw,44px) clamp(22px,4vw,42px);margin:clamp(28px,4vw,40px) 0 8px}
.focus .wm{position:absolute;right:clamp(12px,3vw,34px);top:clamp(18px,3vw,30px);writing-mode:vertical-rl;font:400 clamp(90px,14vw,138px)/1 var(--min);color:#f1f0eb;letter-spacing:.02em;white-space:nowrap;pointer-events:none;user-select:none}
.focus>*{position:relative}
.fword{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.fword .w{font:400 clamp(54px,10vw,92px)/1.45 var(--min);letter-spacing:.04em}
.fword .w rt{font:400 .22em var(--tc);letter-spacing:.1em}
.fword .say{margin-bottom:22px;background:transparent}
.fzh{font-size:17px;margin:0 0 14px;letter-spacing:.04em}
.focus .sub{margin-bottom:26px;font-size:15px}
.btn{border-radius:0;min-height:54px;padding:0 30px;letter-spacing:.16em;font-size:15px;background:var(--ink);border-color:var(--ink)}
.btn .arr{margin-left:10px;letter-spacing:0;font-size:18px}
.btn.ghost{background:transparent}
.sec-h{border:0;margin:clamp(40px,5vw,56px) 0 16px;padding:0;align-items:baseline}
.sec-h h3{font:500 clamp(24px,3vw,30px)/1.2 var(--stc);letter-spacing:.04em}
.sec-h span{font-size:13px;letter-spacing:.24em;color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--paper);border:1px solid var(--line);padding:22px 20px 18px}
.stat b{display:block;font:400 clamp(36px,5vw,48px)/1.1 var(--min)}
.stat span{display:block;margin-top:8px;font-size:13px;letter-spacing:.16em;color:var(--soft)}
.tgrid,.lgrid{gap:10px}
.tile,.lt{background:var(--paper);border-radius:0;border-color:var(--line);padding:16px}
.tile .ic{color:var(--sage)}
.tile b{font-size:15px;font-weight:400;color:var(--ink)}
.lt em{color:var(--sage);letter-spacing:.08em;font-weight:400}

<script>
(async()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ruby=s=>esc(s).replace(/([一-鿿々]+)\{([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const plain=s=>String(s).replace(/\{[^}]*\}/g,'');
const kanaOf=s=>String(s).replace(/([一-鿿々]+)\{([^}]+)\}/g,'$2').replace(/～/g,'');
const DAY=86400000,MIN=60000;
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dk(new Date(Date.now()-4*3600e3));            // 凌晨 4 點換日
const keyDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=keyDate(k);d.setDate(d.getDate()+n);return dk(d)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const toast=(m,ms=3200)=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms)};

// ---- 資料：離線版內嵌，網頁版從同資料夾讀 ----
const load=async(id,url)=>{const el=$(id);if(el&&el.textContent.trim())return JSON.parse(el.textContent);const r=await fetch(url);if(!r.ok)throw new Error(url);return r.json()};
let C,DET,GR,ICO,KJ,MISC;
try{[C,DET,GR,ICO,KJ,MISC]=await Promise.all([load('d-cards','cards.json'),load('d-det','detail.json'),load('d-gram','gram.json').then(x=>x.g),load('d-icons','icons.json'),load('d-kanji','kanji.json'),load('d-misc','misc.json')])}
catch(e){$('v-home').innerHTML='<p class="lead">資料載入失敗，請重新整理頁面。</p>';return}
const TOPICS=[...new Set(C.map(c=>c[9]))];
const GBY=Object.fromEntries(GR.map(g=>[g.id,g]));
const KBY=Object.fromEntries(KJ.map(k=>[k.k,k]));
const lvOf=c=>c[14]||'N5';
const lessonName=u=>u>12?`N4 第 ${u-12} 課`:`N5 第 ${u} 課`;
const EXAM=new Date(2027,6,4),START=new Date(2026,10,2);
const WEEKLY_EXAM='https://claude.ai/artifact/JRXJg1KBCGAvRwfj1oeudF';

// ---- 圖示 ----
const icon=(t,s=22)=>`<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[t]||''}</svg>`;
const NI={home:'<path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-6h4v6"/>',plan:'<rect x="4" y="5" width="16" height="15" rx="1"/><path d="M4 10h16M9 3v4M15 3v4M8 14h3M8 17h6"/>',
 gram:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/>',vocab:'<rect x="4" y="4" width="16" height="16" rx="1"/><path d="M8 9h8M8 13h8M8 17h5"/>',
 kanji:'<rect x="4" y="4" width="16" height="16" rx="1"/><path d="M12 4v16M4 12h16"/>',prac:'<rect x="6" y="3" width="13" height="16" rx="1" transform="rotate(6 12 11)"/><rect x="4" y="5" width="13" height="16" rx="1" fill="var(--paper)"/><path d="M8 11h5M8 15h3"/>',
 kana:'<path d="M6 6h8M10 4c0 6-1 11-5 15M9 11c3 0 7 1 9 5"/>',stats:'<path d="M5 20V10M10 20V4M15 20v-8M20 20v-4"/>',more:'<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>'};
const nic=(k,s=20)=>`<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NI[k]}</svg>`;
const spk='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';

// ---- 進度 ----
const DEFSET={lv:'',deck:'all',mode:'auto',newV:15,newG:3,newK:5,goal:30,auto:true,topic:'',lesson:'',core:false,exN:10,exLv:''};
let S={v:2,it:{},log:{},set:{...DEFSET},fz:0,fzAt:0,fzUsed:[],vids:{},plan:{},kana:{},err:{},lastLesson:1};
function migrate(v){                         // 舊版閃卡（cards：{i,e,r,l,c,n,d}）轉成新版
  if(!v)return null;
  if(v.v===2)return v;
  const o={v:2,it:{},log:{},set:{...DEFSET},fz:0,fzAt:0,fzUsed:[],vids:{},plan:{},kana:{},err:{},lastLesson:v.lastLesson||1};
  for(const [k,st] of Object.entries(v.cards||{})){
    const iv=st.i||0,s=!st.r?1:iv<=1?2:iv<=3?3:iv<=7?4:iv<=14?5:iv<=30?6:iv<=90?7:8;
    o.it['v:'+k]={s,d:st.d||Date.now(),n:st.n||1,c:st.c||0,l:st.l||0,w:st.c<st.n?1:0};
  }
  if(v.day&&v.todayN)o.log[v.day]={n:v.todayN,c:v.todayC||0,nv:v.newToday||0,ng:0,nk:0};
  if(v.set){o.set.limit=v.set.limit;if(v.set.limit)o.set.newV=v.set.limit;o.set.auto=v.set.auto!==false}
  return o;
}
let mem=true;
try{const v=migrate(JSON.parse(localStorage.getItem('n5site')||'null'));if(v){S=Object.assign(S,v);S.set=Object.assign({...DEFSET},v.set||{})}}catch(e){mem=false}
let tmr=null,docRef=null;
const save=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{try{localStorage.setItem('n5site',JSON.stringify(S))}catch(e){}
  if(docRef)docRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{})},800)};
function mergeIn(v){
  v=migrate(JSON.parse(JSON.stringify(v)));if(!v)return;
  for(const [k,st] of Object.entries(S.it))if(!v.it[k]||(v.it[k].n||0)<(st.n||0))v.it[k]=st;
  for(const [d,l] of Object.entries(S.log))if(!v.log[d]||(v.log[d].n||0)<(l.n||0))v.log[d]=l;
  for(const k of ['vids','plan','kana','err'])v[k]=Object.assign({},v[k]||{},S[k]);
  v.set=Object.assign({...DEFSET},S.set,v.set||{});v.fzUsed=[...new Set([...(v.fzUsed||[]),...S.fzUsed])];
  S=Object.assign(S,v);
}
async function sync(){
  const cl=window.claude;if(!cl||!cl.use)return;
  try{const [db,u]=await Promise.all([cl.use('db'),cl.use('user')]);const uid=u&&await u.id();if(!db||!uid)return;
    docRef=db.doc('data/users/'+uid+'/flash');const snap=await docRef.get();
    if(snap.exists)mergeIn(snap.data());
    checkFreeze();save();refresh();
  }catch(e){}
}

// ---- 間隔複習：9 個階段，答錯掉兩階並在 1 分鐘後再考 ----
const IV=[0,10*MIN,DAY,3*DAY,7*DAY,14*DAY,30*DAY,90*DAY,180*DAY];
const STN=['新','學習中','學習中','熟悉','熟悉','精通','精通','牢記','畢業'];
const STC=['#e2ddd2','#d9c9a8','#d9c9a8','#c9d1c3','#c9d1c3','#9fae95','#9fae95','#6b7a60','#3f4a38'];
const stageName=s=>STN[s||0];
const L=()=>{const k=today();return S.log[k]||(S.log[k]={n:0,c:0,nv:0,ng:0,nk:0})};
function nextIv(st,g){
  if(g===1)return MIN;
  const acc=((st.c||0)+1)/((st.n||0)+2),s=g===2?Math.max(1,st.s||1):Math.min(8,(st.s||0)+1);
  let iv=IV[s]*(s>=2?(0.55+0.45*acc):1);
  if(g===2)iv*=0.5;
  return Math.max(MIN,iv>=DAY?iv-3*3600e3:iv);
}
const ivText=ms=>ms<=MIN?'1 分鐘後':ms<3600e3?Math.round(ms/MIN)+' 分鐘後':ms<DAY?Math.round(ms/3600e3)+' 小時後':ms<1.5*DAY?'明天':ms<30*DAY?Math.round(ms/DAY)+' 天後':Math.round(ms/30/DAY)+' 個月後';
function grade(key,g,fromExam){
  const old=S.it[key],st=old?{...old}:{s:0,n:0,c:0,l:0,w:0},isNew=!old,lg=L();
  const iv=nextIv(st,g);
  st.n++;if(g>1)st.c++;
  if(g===1){st.l=(st.l||0)+1;st.w=Math.min(3,(st.w||0)+1);st.s=Math.max(1,(st.s||0)-2);
    const e=S.err[key]||{n:0};S.err[key]={n:e.n+1,t:Date.now()}}
  else{if(g===3){st.s=Math.min(8,(st.s||0)+1);if(st.w)st.w--;if(!st.w)delete S.err[key]}else st.s=Math.max(1,st.s||1)}
  st.d=Date.now()+iv;st.t=Date.now();

const cache={},pend={};

const RO={kya:'きゃ',kyu:'きゅ',kyo:'きょ',sha:'しゃ',shu:'しゅ',sho:'しょ',sya:'しゃ',syu:'しゅ',syo:'しょ',cha:'ちゃ',chu:'ちゅ',cho:'ちょ',tya:'ちゃ',tyu:'ちゅ',tyo:'ちょ',nya:'にゃ',nyu:'にゅ',nyo:'にょ',hya:'ひゃ',hyu:'ひゅ',hyo:'ひょ',mya:'みゃ',myu:'みゅ',myo:'みょ',rya:'りゃ',ryu:'りゅ',ryo:'りょ',gya:'ぎゃ',gyu:'ぎゅ',gyo:'ぎょ',ja:'じゃ',ju:'じゅ',jo:'じょ',jya:'じゃ',jyu:'じゅ',jyo:'じょ',bya:'びゃ',byu:'びゅ',byo:'びょ',pya:'ぴゃ',pyu:'ぴゅ',pyo:'ぴょ',shi:'し',chi:'ち',tsu:'つ',fu:'ふ',ji:'じ',si:'し',ti:'ち',tu:'つ',hu:'ふ',zi:'じ',di:'ぢ',du:'づ',wo:'を',a:'あ',i:'い',u:'う',e:'え',o:'お'};
'k:かきくけこ,s:さしすせそ,t:たちつてと,n:なにぬねの,h:はひふへほ,m:まみむめも,y:や_ゆ_よ,r:らりるれろ,w:わ___を,g:がぎぐげご,z:ざじずぜぞ,d:だぢづでど,b:ばびぶべぼ,p:ぱぴぷぺぽ'.split(',').forEach(x=>{const[k,v]=x.split(':');'aiueo'.split('').forEach((vv,j)=>{if(v[j]!=='_'&&!RO[k+vv])RO[k+vv]=v[j]})});
function romaji(s){
  s=s.toLowerCase();let o='',i=0;
  while(i<s.length){
    const c=s[i];
    if(c==='-'){o+='ー';i++;continue}
    if(c==='n'&&(s[i+1]==="'"||(i+1===s.length)||!'aiueoy'.includes(s[i+1]))){o+='ん';i+=(s[i+1]==="'"||(s[i+1]==='n'&&!(s[i+2]&&'aiueoy'.includes(s[i+2]))))?2:1;continue}
    if(c===s[i+1]&&/[bcdfghjklmpqrstvwxz]/.test(c)){o+='っ';i++;continue}
    let hit=false;for(const L of [3,2,1]){const k=s.substr(i,L);if(RO[k]){o+=RO[k];i+=L;hit=true;break}}
    if(!hit){o+=c;i++}
  }
  return o;
}
const hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
const norm=s=>hira(romaji(s.trim().replace(/[\s　]/g,''))).replace(/[～~]/g,'');

const IROW={う:'い',く:'き',ぐ:'ぎ',す:'し',つ:'ち',ぬ:'に',ぶ:'び',む:'み',る:'り'},AROW={う:'わ',く:'か',ぐ:'が',す:'さ',つ:'た',ぬ:'な',ぶ:'ば',む:'ま',る:'ら'};
const TE={う:'って',つ:'って',る:'って',ぬ:'んで',ぶ:'んで',む:'んで',く:'いて',ぐ:'いで',す:'して'};
function vforms(w,g){
  if(g==='3'){
    if(w.endsWith('来る')||w==='くる'){const s=w.slice(0,-2),k=w.endsWith('来る');return [s+(k?'来ます':'きます'),w,s+(k?'来ない':'こない'),s+(k?'来て':'きて'),s+(k?'来た':'きた'),s+(k?'来なかった':'こなかった')]}
    const s=w.endsWith('する')?w.slice(0,-2):w;return [s+'します',s+'する',s+'しない',s+'して',s+'した',s+'しなかった']}
  if(g==='2'){const s=w.slice(0,-1);return [s+'ます',w,s+'ない',s+'て',s+'た',s+'なかった']}
  const s=w.slice(0,-1),u=w.slice(-1);
  let te=s+TE[u];if(w==='行く'||w==='いく')te=s+'って';
  const ta=te.replace(/て$/,'た').replace(/で$/,'だ');
  let nai=s+AROW[u]+'ない';if(w==='ある')nai='ない';
  return [s+IROW[u]+'ます',w,nai,te,ta,nai.replace(/ない$/,'なかった')];
}
function conj(c){
  let w=c[1],r=c[2]||'',pos=c[3];
  if(w.includes('・')){if(w==='いい・よい'){w='いい';r=''}else if(w==='まるい・丸い'){w='丸い';r='まるい'}else return ''}
  const row=(lab,a,b)=>`<tr><th>${lab}</th><td><b>${esc(a)}</b>${b&&b!==a?`<small>${esc(b)}</small>`:''}</td></tr>`;
  const blk=(h,note,rows)=>`<div class="blk"><h4>${h}</h4>${note?`<p class="reg" style="margin:0 0 6px">${note}</p>`:''}<table class="cj">${rows}</table></div>`;
  if(/動/.test(pos)){
    const g=pos.includes('Ⅲ')?'3':pos.includes('Ⅱ')?'2':'1';
    const A=vforms(w,g),B=r?vforms(r,g):A;
    const lab=['ます形（禮貌）','辭書形（原形）','ない形（不～）','て形（連接、請求）','た形（過去）','なかった形（過去否定）'];
    const note={1:'Ⅰ類（五段）：ます形把字尾換成い段；て形看字尾分「って／んで／いて／して」。',2:'Ⅱ類（一段）：去掉る直接接，變化最規則。',3:'Ⅲ類（不規則）：する、来る要整組背。'}[g];
    return blk(`動詞變化・${g==='3'?'Ⅲ':g==='2'?'Ⅱ':'Ⅰ'}類`,note,lab.map((l,i)=>row(l,A[i],r?B[i]:'')).join(''));
  }
  if(pos==='い形'){
    const f=x=>x==='いい'?'よ':x.slice(0,-1),A=f(w),B=r?f(r):'';
    const rows=[['肯定',w,r],['否定','くない'],['過去','かった'],['過去否定','くなかった'],['て形（連接）','くて'],['副詞（＋動詞）','く']];
    return blk('い形容詞變化',w==='いい・よい'||w==='いい'?'いい 變化時一律用 よ：よくない、よかった。':'去掉字尾 い 再接；禮貌體在後面加「です」。',rows.map(([l,x,y],i)=>i===0?row(l,x,y):row(l,A+x,r?B+x:'')).join(''));
  }
  if(pos==='な形'){
    const n=w==='同じ'?'同じ（不加な）':w+'な';
    const rows=[['肯定（普通體）','だ'],['否定','じゃない'],['過去','だった'],['過去否定','じゃなかった'],['て形（連接）','で'],['副詞（＋動詞）','に']];
    return blk('な形容詞變化','變化方式跟名詞一樣；只有修飾名詞時要加「な」。',rows.map(([l,x])=>row(l,w+x,r?r+x:'')).join('')+row('修飾名詞',n+' ＋ 名詞',r&&w!=='同じ'?r+'な':''));
  }
  return '';
}

}
function answer(k){if(choice!==null||!cur)return;choice=k;afterAnswer()}
function typeAns(a){const q=cur;const ans=(q.c[2]||q.c[1]).split('・').map(norm);const v=a.trim();typed={a:v,ok:!!v&&(ans.includes(norm(v))||ans.includes(norm(v.replace(/nn/gi,"n'"))))};afterAnswer()}
function afterAnswer(){renderQ();$('bN').focus({preventScroll:true});const q=cur;
  if(q.t==='v'&&S.set.auto!==false)play(q.c,q.m==='L'||q.m==='D'?'e':'w',$('card').querySelector('.say[data-s="w"]'));
  if(q.t==='g'){const j=q.z?q.z[3]:0;playSrc(gClip(q.g.id,j),q.g.sp[j],$('card').querySelector('.say[data-g]'))}}
function proceed(guess){const ok=isRight();if(ok===null)return;grade(cur.key,guess&&ok?2:ok?3:1);sess.done++;if(ok)sess.ok++;
  if(sess.fixed&&!ok)sess.keys.splice(Math.min(3,sess.keys.length),0,cur.key);   // 固定清單：答錯的稍後再出一次
  nextQ()}

// ---- 日檢題型 ----
const QT={yomi:'漢字讀法',hyoki:'表記',bun:'文脈規定',gram:'文法',star:'★排序',listen:'聽解'};
function examPool(lv){
  const all=C.filter(c=>!lv||lvOf(c)===lv),lrn=all.filter(c=>S.it['v:'+c[0]]);
  return lrn.length>=24?lrn:all;
}
const hasK=w=>/[一-鿿]/.test(w);
function fakeReadings(r){
  const out=new Set(),sw={か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',た:'だ',ち:'ぢ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ'};
  const rev=Object.fromEntries(Object.entries(sw).map(([a,b])=>[b,a]));
  for(let i=0;i<r.length;i++){const ch=r[i];
    if(sw[ch])out.add(r.slice(0,i)+sw[ch]+r.slice(i+1));if(rev[ch])out.add(r.slice(0,i)+rev[ch]+r.slice(i+1));
    if('おこそとのほもよろごぞどぼぽ'.includes(ch)&&r[i+1]!=='う')out.add(r.slice(0,i+1)+'う'+r.slice(i+1));
    if(ch==='う'&&i>0)out.add(r.slice(0,i)+r.slice(i+1));
    if(ch==='っ')out.add(r.slice(0,i)+r.slice(i+1));
    if('かきくけこさしすせそたちつてとぱぴぷぺぽ'.includes(r[i+1]||'')&&i>0&&ch!=='っ'&&i<r.length-1)out.add(r.slice(0,i+1)+'っ'+r.slice(i+1));}
  out.delete(r);return shuffle([...out]);
}
function genQ(type,lv){
  const P=examPool(lv),KW=P.filter(c=>hasK(c[1])&&c[2]&&!c[1].includes('・')&&!c[2].includes('・'));
  const sentOf=c=>plain(c[5]);
  if(type==='yomi'){const c=pick(KW),s=sentOf(c),r=c[2];
    const f=fakeReadings(r).slice(0,2),o=distract(KW.filter(x=>Math.abs(x[2].length-r.length)<=1),c,x=>x[2],3).map(x=>x[2]);
    const options=shuffle([r,...[...new Set([...f,...o])].filter(x=>x!==r).slice(0,3)]);
    const stem=s.includes(c[1])?esc(s).replace(esc(c[1]),'<u>'+esc(c[1])+'</u>'):'<u>'+esc(c[1])+'</u>';
    return {type,key:'v:'+c[0],ask:'＿＿的字怎麼唸？',stem,options,ans:options.indexOf(r),exp:`<div class="jpx">${ruby(c[5])}</div><div class="t">${esc(c[6])}</div>`,c}}
  if(type==='hyoki'){const c=pick(KW),s=sentOf(c);
    const share=KW.filter(x=>x!==c&&[...c[1]].some(ch=>hasK(ch)&&x[1].includes(ch))&&x[1]!==c[1]);
    const o=[...new Set([...shuffle(share).map(x=>x[1]),...distract(KW.filter(x=>x[3]===c[3]),c,x=>x[1],6).map(x=>x[1])])].filter(x=>x!==c[1]).slice(0,3);
    const options=shuffle([c[1],...o]);
    const stem=s.includes(c[1])?esc(s).replace(esc(c[1]),'<u>'+esc(c[2])+'</u>'):'<u>'+esc(c[2])+'</u>';
    return {type,key:'v:'+c[0],ask:'＿＿的詞用漢字怎麼寫？',stem,options,ans:options.indexOf(c[1]),exp:`<div class="jpx">${ruby(c[5])}</div><div class="t">${esc(c[6])}</div>`,c}}
  if(type==='bun'){const cand=P.filter(c=>/^(名|い形|な形|副)/.test(c[3])&&!c[1].includes('・')&&sentOf(c).includes(c[1]));const c=pick(cand);
    const o=distract(P.filter(x=>x[3]===c[3]&&x[1]!==c[1]),c,x=>x[1]);
    const options=shuffle([c[1],...o.map(x=>x[1])]);
    return {type,key:'v:'+c[0],ask:'（　）裡放哪一個最適合？',stem:esc(sentOf(c)).replace(esc(c[1]),'（　　）'),options,ans:options.indexOf(c[1]),exp:`<div class="jpx">${ruby(c[5])}</div><div class="t">${esc(c[6])}</div>`,c}}
  if(type==='gram'){const G=GR.filter(g=>(!lv||g.lv===lv)&&g.cz.length),lg=G.filter(g=>S.it['g:'+g.id]),src2=lg.length>=8?lg:G;const g=pick(src2),z=pick(g.cz);
    const others=[...new Set(shuffle(G.filter(o=>o.id!==g.id)).map(o=>pick(o.cz)[1]))].filter(a=>a!==z[1]).slice(0,3);
    const options=shuffle([z[1],...others]);
    return {type,key:'g:'+g.id,ask:'（　）裡放哪一個最適合？',stem:ruby(z[0]).replace('＿＿','（　　）'),hint:z[2],options,ans:options.indexOf(z[1]),exp:`<div class="jpx">${ruby(g.ex[z[3]][0])}</div><div class="t">${esc(g.ex[z[3]][1])}</div><div class="small">${esc(g.t)}：${ruby(g.key)}</div>`,g,j:z[3]}}
  if(type==='star'){
    for(let tries=0;tries<30;tries++){
      const useG=Math.random()<.6,G=GR.filter(g=>!lv||g.lv===lv);let ja,zh,key,g=null,c=null,j=0;
      if(useG){g=pick(G);j=Math.floor(Math.random()*g.ex.length);[ja,zh]=g.ex[j];key='g:'+g.id}else{c=pick(P);ja=c[5];zh=c[6];key='v:'+c[0]}
      const tok=plain(ja).replace(/[。！？]$/,'').split(/\s+/).filter(Boolean);if(tok.length<5)continue;
      const st=Math.floor(Math.random()*(tok.length-4)),win=tok.slice(st,st+4);if(new Set(win).size<4)continue;
      const stem=esc(tok.slice(0,st).join(' '))+' <span class="star"></span><span class="star"></span><span class="star k">★</span><span class="star"></span> '+esc(tok.slice(st+4).join(' '))+'。';
      const options=shuffle(win);
      return {type,key,ask:'放進 ★ 的是哪一個？',stem,hint:zh,options,ans:options.indexOf(win[2]),exp:`<div class="jpx">${ruby(ja)}</div><div class="t">${esc(zh)}</div><div class="small">正確順序：${win.map(esc).join(' → ')}</div>`,g,j,c}}
    return genQ('gram',lv)}
  // 聽解：聽例句選意思
  const c=pick(P),o=distract(P,c,x=>x[6]);const options=shuffle([c[6],...o.map(x=>x[6])]);
  return {type:'listen',key:'v:'+c[0],ask:'聽句子，選出正確的意思',stem:`<button class="bigplay" id="xPlay" aria-label="播放">${spk}</button>`,options,ans:options.indexOf(c[6]),exp:`<div class="jpx">${ruby(c[5])}</div><div class="t">${esc(c[6])}</div>`,c,listen:true}
}
function startExam(type,lv,n){
  const types=type==='mix'?['yomi','yomi','hyoki','hyoki','bun','bun','gram','gram','star','listen']:[type];
  const qs=[];for(let i=0;i<n;i++){try{qs.push(genQ(types[i%types.length],lv))}catch(e){}}
  sess={kind:'exam',qs:shuffle(qs),i:0,ok:0,title:'日檢題型・'+(type==='mix'?'混合':QT[type]),ans:[]};renderExam();
}
function renderExam(){
  const s=sess,q=s.qs[s.i];
  if(!q){const wrong=s.ans.filter(a=>!a.ok);
    $('v-prac').innerHTML=`<h2>${esc(s.title)}</h2><div class="panel"><p class="eb">成績</p><div class="cd"><b>${s.ok}</b><span class="small">/ ${s.qs.length} 題・${Math.round(s.ok/Math.max(1,s.qs.length)*100)} 分</span></div>
     ${wrong.length?`<div class="sec-h" style="margin-top:20px"><h3>答錯的題目</h3><span>已收進錯題本</span></div><div class="errl">${wrong.map(a=>`<div class="erri"><span class="ty">${QT[a.q.type]}</span><span class="w">${esc(itemLabel(a.q.key))}<span class="small">　${esc(itemMean(a.q.key))}</span></span><span class="p">正解：${esc(a.q.options[a.q.ans])}</span></div>`).join('')}</div>`:'<p class="small">全部答對！</p>'}
     <div class="btns"><button class="btn" id="xAgain">再做一回</button><button class="btn ghost" id="xBack">回練習選單</button></div></div>`;
    $('xAgain').onclick=()=>startExam(s.title.includes('混合')?'mix':Object.keys(QT).find(k=>s.title.endsWith(QT[k]))||'mix','',s.qs.length);$('xBack').onclick=()=>{sess=null;setupView()};return}
  const a=s.ans[s.i];
  $('v-prac').innerHTML=`<div class="fhead"><div><p class="eb" style="margin:0">${esc(s.title)}</p><span class="small">第 ${s.i+1} / ${s.qs.length} 題・答對 ${s.ok}</span></div><button class="btn ghost" id="qEnd" style="min-height:38px;padding:0 14px">結束</button></div>
   <div class="stage"><div class="card"><div class="mq"><span class="qt">${QT[q.type]}</span><div class="small">${esc(q.ask)}</div><div class="qs">${q.stem}</div>${q.hint?`<div class="czh" style="text-align:left">${esc(q.hint)}</div>`:''}
    <div class="choices">${q.options.map((o,k)=>`<button class="ch j${a?(k===q.ans?' ok':k===a.k?' ngc':''):''}" data-k="${k}" ${a?'disabled':''}><b>${k+1}</b>${esc(o)}</button>`).join('')}</div>
    ${a?`<div class="back"><div class="verdict ${a.ok?'ok':'ng'}">${a.ok?'答對了':'答錯了，正解是「'+esc(q.options[q.ans])+'」'}</div><div class="bex">${q.exp} ${sayBtn('id="xSay" style="vertical-align:middle"')}</div></div>`:''}</div></div></div>
   <div class="act"><button class="btn" id="xNext" ${a?'':'disabled'}>${s.i+1<s.qs.length?'下一題 →':'看成績'}</button></div>`;
  $('qEnd').onclick=()=>{sess=null;setupView()};
  const playQ=btn=>{if(q.c)play(q.c,'e',btn);else if(q.g)playSrc(gClip(q.g.id,q.j),q.g.sp[q.j],btn)};
  const xp=$('xPlay');if(xp){xp.onclick=()=>playQ(xp);if(!a)setTimeout(()=>playQ(xp),150)}
  const xs=$('xSay');if(xs)xs.onclick=()=>playQ(xs);
  $('v-prac').querySelectorAll('.ch:not([disabled])').forEach(b=>b.onclick=()=>examAns(+b.dataset.k));
  $('xNext').onclick=()=>{s.i++;renderExam()};
  if(a)$('xNext').focus({preventScroll:true});
}
function examAns(k){const s=sess,q=s.qs[s.i];if(s.ans[s.i])return;const ok=k===q.ans;s.ans[s.i]={k,ok,q};if(ok)s.ok++;
  const lg=L();lg.n++;if(ok)lg.c++;
  if(!ok){const e=S.err[q.key]||{n:0};S.err[q.key]={n:e.n+1,t:Date.now()};const st=S.it[q.key];if(st){st.d=Date.now();st.w=Math.min(3,(st.w||0)+1)}}
  bumpStreak();save();renderExam();
  const xs=$('xSay');if(xs&&(q.type!=='listen'))setTimeout(()=>{if(q.c)play(q.c,'e',xs);else if(q.g)playSrc(gClip(q.g.id,q.j),q.g.sp[q.j],xs)},100)}

// ---- 學習紀錄 ----
function statsView(){
  const now=Date.now(),t0=today();
  // 熱度日曆：近 16 週
  let start=addDays(t0,-(7*16-1));const sd=keyDate(start).getDay();start=addDays(start,-sd);
  let cells='',k=start;while(k<=t0){const n=(S.log[k]||{}).n||0,l=!n?0:n<10?1:n<30?2:n<60?3:4;cells+=`<i data-l="${S.fzUsed.includes(k)?1:l}" title="${k}：${n} 題"></i>`;k=addDays(k,1)}
  // 7 天預告
  const all=Object.values(S.it),fc=Array.from({length:7},(_,i)=>{const a=i===0?0:keyDate(addDays(t0,i)).getTime()+4*3600e3,b=keyDate(addDays(t0,i+1)).getTime()+4*3600e3;return all.filter(st=>i===0?st.d<b:st.d>=a&&st.d<b).length});
  const mx=Math.max(1,...fc);
  const stg=t=>{const a=Array(9).fill(0);Object.entries(S.it).forEach(([kk,st])=>{if(kk[0]===t)a[st.s||0]++});return a};
  const bar=(a,tot)=>{const grp=[[1,2],[3,4],[5,6],[7],[8]];return `<div class="stg">${grp.map(g=>{const n=g.reduce((s,i)=>s+a[i],0);return n?`<i style="width:${n/tot*100}%;background:${STC[g[0]]}" title="${STN[g[0]]} ${n}"></i>`:''}).join('')}<i style="flex:1;background:var(--bg)"></i></div>`};
  const types=[['v','單字',C.length],['g','文法',GR.length],['k','漢字',KJ.length]];
  const by={};for(const c of C){const st=S.it['v:'+c[0]];if(!st||!st.n)continue;const x=by[c[9]]||(by[c[9]]={n:0,c:0});x.n+=st.n;x.c+=st.c}
  const ts=Object.entries(by).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n);
  $('v-stats').innerHTML=`<h2>學習紀錄</h2><p class="lead">連續 ${streak()} 天・休息日 ${S.fz||0} 次・累積答對率 ${accAll()}</p>
   <div class="sec-h"><h3>學習日曆</h3><span>近 16 週・顏色越深做越多</span></div><div class="panel"><div class="heat">${cells}</div></div>
   <div class="sec-h"><h3>未來 7 天的複習量</h3><span>先清掉今天的，之後就不會堆積</span></div>
   <div class="panel"><div class="fc">${fc.map((n,i)=>`<div><b>${n}</b><i style="height:${n/mx*100}%"></i><span>${i===0?'今天':i===1?'明天':(keyDate(addDays(t0,i)).getMonth()+1)+'/'+keyDate(addDays(t0,i)).getDate()}</span></div>`).join('')}</div></div>
   <div class="sec-h"><h3>熟練度</h3><span>學習中 → 熟悉 → 精通 → 牢記 → 畢業</span></div>
   <div class="panel">${types.map(([t,n,tot])=>{const a=stg(t),l=a.slice(1).reduce((x,y)=>x+y,0);return `<p class="small" style="margin:10px 0 6px">${n}：已學 ${l} / ${tot}</p>${bar(a,tot)}`}).join('')}
    <div class="stgl">${[[1,'學習中'],[3,'熟悉'],[5,'精通'],[7,'牢記'],[8,'畢業']].map(([i,n])=>`<span style="--c:${STC[i]}">${n}</span>`).join('')}</div></div>
   <div class="sec-h"><h3>各主題答對率</h3><span>由低到高</span></div>
   <div class="panel">${ts.length?ts.map(([t,v])=>`<div class="tr"><span>${esc(t)}</span><span class="barl"><i style="width:${v.c/v.n*100}%"></i></span><span class="p">${Math.round(v.c/v.n*100)}%</span></div>`).join(''):'<p class="small">作答後就會出現。</p>'}</div>
   <details class="set bk"><summary>備份／搬移進度</summary><p class="small">${docRef?'進度已自動存在你的 Claude 帳號。這裡的進度碼可以當作額外備份，或搬到離線檔使用。':'進度存在這台裝置的瀏覽器裡。換裝置時按「複製進度碼」，到另一台裝置貼上後按「匯入」。'}</p>
    <div class="btns" style="margin-top:0"><button class="btn ghost" id="bkCopy">複製進度碼</button><button class="btn ghost" id="bkImp">匯入</button></div>
    <textarea id="bkText" aria-label="進度碼" placeholder="在這裡貼上進度碼"></textarea><p class="small" id="bkMsg"></p></details>`;
  $('bkCopy').onclick=async()=>{const t=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('bkText').value=t;
    try{await navigator.clipboard.writeText(t);$('bkMsg').textContent='已複製。到另一台裝置貼上後按「匯入」。'}catch(e){$('bkText').select();$('bkMsg').textContent='請手動全選上面的文字複製。'}};
  $('bkImp').onclick=()=>{try{const v=JSON.parse(decodeURIComponent(escape(atob($('bkText').value.trim()))));if(!v.it&&!v.cards)throw 0;mergeIn(v);save();$('bkMsg').textContent=`匯入完成，共 ${Object.keys(S.it).length} 個項目的進度。`;statsView()}catch(e){$('bkMsg').textContent='進度碼格式不對，請重新複製一次。'}};
}

// ---- 鍵盤 ----
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('sheet').hidden){closeSheet();return}if(!$('more').hidden){$('more').hidden=true;return}}
  if(view!=='prac'||!sess||!$('sheet').hidden)return;
  if(sess.kind==='exam'){if(/^[1-4]$/.test(e.key)&&!sess.ans[sess.i])examAns(+e.key-1);else if(e.key==='Enter'&&sess.ans[sess.i]&&e.target.id!=='xNext'){e.preventDefault();sess.i++;renderExam()}return}
  if(e.target.tagName==='INPUT'&&e.key==='Enter'&&isRight()!==null){e.preventDefault();proceed(false);return}
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const ok=isRight();
  if(ok===null&&cur&&cur.opts&&/^[1-4]$/.test(e.key))answer(+e.key-1);
  else if(ok!==null&&e.key==='Enter'){if(e.target.tagName==='BUTTON'&&e.target.id!=='bN')return;e.preventDefault();proceed(false)}
  else if(ok&&/^g$/i.test(e.key))proceed(true);
  else if(/^s$/i.test(e.key)&&cur&&cur.t==='v')play(cur.c,ok!==null?'e':'w');
});

// ---- 啟動 ----
const start0=(location.hash||'').slice(1);
go(VIEWS.some(([k])=>k===start0)?start0:'home');
sync();
})();
